plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Shared loader-agnostic sources live in the fabric module's java tree.
// Exclude only Fabric-specific classes; everything else (Constants, ModCreativeTabs) is shared.
sourceSets.main.java {
    srcDir '../fabric/src/main/java'
    exclude 'com/example/examplemod/ExampleMod.java', 'com/example/examplemod/CommonClass.java',
            'com/example/examplemod/mixin/**', 'com/example/examplemod/platform/**'
}
sourceSets.main.resources {
    srcDir '../fabric/src/main/resources'
    exclude 'fabric.mod.json', '**/*.mixins.json', '**/*.accesswidener', 'META-INF/services/**'
}

neoForge {
    version = neoforge_version
    def at = file('../fabric/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
